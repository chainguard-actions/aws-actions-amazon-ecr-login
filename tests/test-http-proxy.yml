name: Test http-proxy input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          registry-type: private
          http-proxy: 'http://proxy.example.com:3128'
      - name: Assert action ran with http-proxy input (fails gracefully without real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REGISTRY: ${{ steps.action.outputs.registry }}
        run: |
          echo "outcome: $OUTCOME"
          echo "registry: $REGISTRY"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$REGISTRY" ]; then
              echo "FAIL: action succeeded but registry output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with http-proxy input, registry=$REGISTRY"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real AWS credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
