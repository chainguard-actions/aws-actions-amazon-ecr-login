name: Test ECR Login - HTTP Proxy Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Attempt ECR login with http-proxy set
        id: action
        uses: .
        with:
          registry-type: private
          http-proxy: 'http://proxy.example.com:3128'
          skip-logout: 'true'
        continue-on-error: true
      - name: Assert action ran (http-proxy input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the credentials are fake and proxy is unreachable,
          # but it should NOT fail due to an invalid http-proxy input.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — http-proxy input was accepted"
