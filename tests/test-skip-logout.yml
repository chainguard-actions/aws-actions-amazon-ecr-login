name: Test ECR Login with Skip Logout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure fake AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<'EOF'
          [default]
          aws_access_key_id = AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          EOF
          cat > ~/.aws/config <<'EOF'
          [default]
          region = us-east-1
          EOF

      - id: ecr-login
        uses: .
        with:
          registry-type: private
          skip-logout: 'false'
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        continue-on-error: true

      - name: Assert action ran with skip-logout=false
        env:
          OUTCOME: ${{ steps.ecr-login.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (if real creds) or fail with an AWS auth error
          # It should NOT crash with a Node.js/code error when skip-logout=false
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with skip-logout=false (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
