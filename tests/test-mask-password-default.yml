name: Test ECR Login - Mask Password Default (true)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt ECR login with mask-password true (default)
        id: ecr-login
        uses: .
        with:
          registry-type: private
          mask-password: 'true'
          skip-logout: 'true'
        continue-on-error: true

      - name: Assert action failed due to missing credentials (not a code error)
        env:
          OUTCOME: ${{ steps.ecr-login.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "UNEXPECTED SUCCESS: action should have failed without AWS credentials"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials (mask-password=true, outcome=$OUTCOME)"
