name: Test registries input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          registries: '123456789012'
          registry-type: private
          skip-logout: 'true'
        continue-on-error: true
      - name: Assert registries input was accepted
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail without real AWS credentials, but it must
          # have processed the registries input (not failed due to unknown input).
          # A failure due to AWS auth is acceptable; a failure due to unknown
          # input is not. We check that the outcome is either success or failure
          # (not skipped), meaning the action ran and processed the input.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with registries input"
