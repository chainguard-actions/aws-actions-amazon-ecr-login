name: Test http-proxy input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ECR login with http-proxy input (expect failure without credentials)
        id: action
        uses: .
        with:
          registry-type: private
          http-proxy: 'http://proxy.example.com:3128'
        continue-on-error: true

      - name: Assert action failed due to missing credentials (not proxy error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials (http-proxy input was accepted)"
