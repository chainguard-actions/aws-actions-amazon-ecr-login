name: Test ECR Login - Multiple Registries Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: ecr-login
        uses: .
        with:
          registry-type: private
          registries: '123456789012,234567890123'
          skip-logout: 'true'
          mask-password: 'false'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_SESSION_TOKEN: ''
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action failed due to missing credentials (multiple registries)
        env:
          OUTCOME: ${{ steps.ecr-login.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no AWS credentials are provided (multiple registries path)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded unexpectedly (real AWS credentials may be present)"
            # If it succeeded with multiple registries, registry output should NOT be set
            # (per action docs: "If logging into multiple registries on ECR Private, this output will not be set")
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            echo "registry output: '$REGISTRY'"
            echo "PASS: action completed (registry output may be empty for multiple registries)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
