name: Test ECR Login - Private Registry (no real creds)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Attempt ECR private login (expect AWS auth failure, not config failure)
        id: action
        uses: .
        with:
          registry-type: private
          skip-logout: 'true'
        continue-on-error: true
      - name: Assert action ran and failed due to AWS auth (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the credentials are fake,
          # but it should NOT fail due to missing configuration.
          # Valid outcomes: 'failure' (AWS rejected fake creds) or 'success' (unlikely without real creds)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — config was valid"
