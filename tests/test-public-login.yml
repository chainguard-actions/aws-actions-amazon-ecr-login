name: Test ECR Public Registry Login (error handling without credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: login
        uses: .
        with:
          registry-type: public
          skip-logout: 'true'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_REGION: us-east-1

      - name: Assert action ran (succeeded or failed with credential error)
        env:
          OUTCOME: ${{ steps.login.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without real AWS credentials, the action is expected to fail
          # with an AWS credential/auth error. That is the correct behavior.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without valid AWS credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real credentials were available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
