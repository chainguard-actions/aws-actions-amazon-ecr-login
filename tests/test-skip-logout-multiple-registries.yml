name: Test skip-logout=true with multiple registries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          registry-type: private
          registries: '123456789012,098765432109'
          skip-logout: 'true'
          mask-password: 'true'
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action failed at AWS auth stage (inputs accepted correctly)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid AWS credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted skip-logout=true and multiple registries, failed at AWS auth stage"
